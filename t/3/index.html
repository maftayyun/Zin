<!doctype html><html lang="ar" dir="rtl" data-v="3"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>زِنِ الحَرْفَ · من الآية (نسخة تجريبية)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="look.css">
<style>
@font-face{font-family:ZinQ;src:url(../assets/zinq.woff2) format("woff2");font-display:block}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);font-family:"Noto Sans Arabic",system-ui,sans-serif;color:var(--ink);direction:rtl;line-height:1.7;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.q{font-family:ZinQ;font-weight:400;letter-spacing:0}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:12px}
.lh{padding:20px 22px 0}
.lh h1{margin:0;font-family:"Markazi Text",serif;font-size:46px;font-weight:700;line-height:1.1}
.lh p{margin:4px 0 0;font-size:13px;color:var(--ink2);line-height:1.8}
.cont{display:block;margin:14px 22px 8px;padding:14px 16px;border-radius:24px;background:var(--tint)}
.cont small{font-size:12px;font-weight:600;color:var(--ac)}
.cont .a{font-family:ZinQ;font-size:clamp(22px,6.600vw,27px);line-height:1.9;margin:0 0 6px}
.cont .f{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cont .f span{font-size:12px;color:var(--ink2)}
.cont .f b{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 18px;border-radius:99px;background:var(--ink);color:#fff;font-size:13.500px;font-weight:600;white-space:nowrap}
.ls{padding:0 22px}
.lr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-height:60px}
.lr.off b{color:var(--ink3);font-weight:500}
.chh{display:flex;align-items:baseline;gap:10px;margin:26px 22px 2px;font-size:14px;font-weight:600;line-height:1.6;color:var(--ink2)}
.chh i{font-style:normal;flex:none;font-family:"Markazi Text",serif;font-size:28px;font-weight:700;line-height:1;color:var(--ac)}
.lr .no{font-family:"Markazi Text",serif;font-size:30px;font-weight:700;line-height:1;color:var(--ink3)}
.lr b{display:block;font-size:14px;font-weight:600;line-height:1.55}
.lr b .q{font-size:1.15em}
.lr span.c{display:block;font-size:11.500px;line-height:1.6;color:var(--ink3)}
.lr .st{font-size:11.500px;font-weight:600;color:var(--ink3);white-space:nowrap}
.lr.done .no{color:var(--ok)}.lr.done .st{color:var(--ok)}
.foot{padding:18px 22px 30px;font-size:11.500px;line-height:1.9;color:var(--ink3)}
.foot a{text-decoration:underline;display:inline-flex;align-items:center;min-height:44px;font-weight:600}
.ab{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 18px}
.ab .ib{background:#fff}
.body{overflow:visible;padding-bottom:12px}
.h1{font-size:clamp(28px,8.400vw,38px);line-height:1.25}
.h1 .q{font-size:.7em}
.quote .q{font-size:1.25em}
.ay{font-size:clamp(27px,8.200vw,40px);line-height:2.2;margin:6px -4px 10px}
.ay.long{font-size:clamp(21px,6.200vw,28px);line-height:2.3}
.ay em.wq{color:var(--wa)}
.ay em.nb::after,.ay em.wq::after{display:none}
.ay em.g{color:var(--ok)}.ay em.g::after{background:var(--ok-s);color:var(--ok)}
.ay em.w{color:var(--wa)}.ay em.w::after{background:var(--wa);color:#fff}
.ay em.g::after,.ay em.w::after{content:attr(data-g);width:auto;min-width:19px;padding:0 4px;border-radius:99px;font-size:10.500px}
.nor{padding:9px 14px;border-radius:14px;background:var(--tint);color:var(--ink2);font-size:12px;line-height:1.8}
.pend{font-size:10.500px;font-weight:600;color:var(--ink3);border:1px dashed var(--ink3);border-radius:99px;padding:0 9px;white-space:nowrap}
.rw{grid-template-columns:22px 1fr auto;gap:2px 10px;padding:9px 0}
.rw .w{font-size:clamp(23px,6.800vw,27px)}
.rw .w.grp{word-spacing:10px;color:var(--ac)}
.rw.wq .w em,.rw.wq .w.grp{color:var(--wa)}
.rw .n.wq{background:var(--wa)}
.rw .tm{gap:8px}
.rw .vd{font-size:12.500px;font-weight:600;padding:2px 12px;border-radius:99px;background:var(--ac-s);color:var(--ac);white-space:nowrap}
.dts{display:flex;gap:3px;direction:ltr;align-items:center}
.dts i{width:8px;height:8px;border-radius:50%;background:var(--ac)}
.dts i.h{width:4px;border-radius:8px 0 0 8px}
.dts i.z{background:transparent;box-shadow:inset 0 0 0 1.500px var(--ink3)}
.dts b{width:5px}
.rw.wq .dts i{background:var(--wa)}
.split{display:grid;grid-template-columns:auto auto 1fr auto 1fr;gap:8px;align-items:center;margin:10px 0 4px}
.split .src{font-family:ZinQ;font-size:34px;line-height:1.5;color:var(--ac)}
.split .op{font-size:18px;color:var(--ink3)}
.split .pt{border:1.500px solid var(--line);border-radius:16px;padding:6px 8px 8px;text-align:center}
.split .pt .g{font-family:ZinQ;font-size:30px;line-height:1.5;display:block}
.split .pt b{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.500px;font-weight:600;flex-wrap:wrap}
.dock{position:sticky;bottom:0;margin-top:auto;background:linear-gradient(to bottom,transparent,var(--bg) 24%);padding:14px 22px calc(18px + env(safe-area-inset-bottom))}
.dock .cta{min-width:0}
.dock .cta.on{background:#C4321C}
.dock .alt{white-space:nowrap}
.recng{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;color:#C4321C;margin-top:8px}
.recng i{width:10px;height:10px;border-radius:50%;background:#C4321C;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.mine{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:99px;background:var(--tint);direction:ltr;margin-top:6px}
.mine .pb{flex:none;width:42px;height:42px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.mine .wv{flex:1;min-width:0;display:flex;justify-content:flex-end}
.mine .who{font-size:12.500px;font-weight:600;direction:rtl}
.wsvg{max-width:100%}
.score p b{line-height:1.6}
.fx p .q{font-size:1.25em}
.pc{border:1.500px solid var(--line);border-radius:20px;padding:10px 12px;margin-top:8px}
.pc.ok{border-color:var(--ok);background:#F5FBF8}
.pc .hd{display:flex;align-items:center;gap:10px}
.pc .hd i{font:600 11px/20px "Noto Sans Arabic",sans-serif;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;text-align:center;font-style:normal;flex:none}
.pc .hd .w{font-family:ZinQ;font-size:26px;line-height:1.5}
.pc .hd .w em{font-style:normal;color:var(--ac)}
.pc .hd b{margin-inline-start:auto;font-size:12px;font-weight:600;padding:2px 11px;border-radius:99px;background:var(--tint);white-space:nowrap;display:flex;align-items:center;gap:6px}
.pc p{margin:2px 0 8px;font-size:12px;line-height:1.75;color:var(--ink2)}
.acts{display:grid;grid-template-columns:1.300fr 1fr 1fr;gap:6px}
.acts button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600}
.acts button.y{background:var(--ok);border-color:var(--ok);color:#fff}
.acts button[disabled]{opacity:.4}
.hl{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:16px;background:var(--ac-s);font-size:12.500px;line-height:1.75;color:#1B2596;margin-top:4px}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;gap:8px}
.end .ok{width:86px;height:86px;border-radius:50%;background:var(--ok-s);display:grid;place-items:center}
.end h1{margin:10px 0 0;font-family:"Markazi Text",serif;font-size:38px;line-height:1.2}
.end p{margin:0;color:var(--ink2);font-size:14px}
.end .cta{margin-top:18px;padding:0 28px}
.end a.back{margin-top:10px;font-size:14px;font-weight:600;color:var(--ac);min-height:44px;display:flex;align-items:center}
@media (prefers-reduced-motion:reduce){.recng i{animation:none}}
</style></head><body>
<div class="app" id="app"></div>
<script src="../assets/data.js"></script><script src="../assets/zf-forms.js"></script><script src="../assets/husary.js"></script><script src="../assets/zf.js"></script><script src="../assets/core.js"></script>
<script>
(() => {
const { D, $, esc, AR, LES, vName, qt, dots, parts } = Z, app = $('#app');
const ALL = D.lessons.map(l => l.id), IDS = ALL.filter(id => LES[id].ayah);   // a lesson needs an ayah the checker can read
const I = {
  back: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
  mic: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  stop: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.500" fill="#fff"/></svg>',
  play: (c, s = 12) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>`,
  ok: (c, s = 13) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>`,
  ear: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A3DE8" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:3px"><path d="M7 10a5 5 0 1 1 9 3c-1 1-1.500 2-1.500 3.500a3 3 0 0 1-5.500 1"/></svg>',
};
const text = a => Z.ayahText(a), word = (a, wi) => a.w[wi].map(u => u.c).join('');
const grouped = L => L.marks.length > 3;   // many places: shown by colour and listed together, not numbered one by one
// the ayah with the places of the rule lit; `cls(mark, i)` and `tag(mark, i)` choose the look of each
function ayahHTML(L, cls, tag) {
  const a = L.ayah, at = {}; L.marks.forEach((m, i) => { at[m.wi + ':' + m.ci] = i; });
  return a.w.map((w, wi) => w.map((u, ci) => { const i = at[wi + ':' + ci]; return i == null ? esc(u.c) : `<em class="${cls(L.marks[i], i)}"${tag ? tag(L.marks[i], i) : ''}>${esc(u.c)}</em>`; }).join('')).join(' ');
}
const wordLit = (L, m) => L.ayah.w[m.wi].map((u, ci) => ci === m.ci ? `<em>${esc(u.c)}</em>` : esc(u.c)).join('');
const val = m => m.ans ? `<span class="vd">${esc(m.ans)}</span>` : `${dots(m.v)}${esc(m.v.includes('+') ? 'حرفان' : vName(m.v))}`;
const ayCls = a => 'ay q' + (text(a).length > 40 ? ' long' : '');

function list() {
  const S = Z.S(), nx = IDS.find(id => !S.done[id]) || IDS[0], L = LES[nx];
  app.innerHTML = `<header class="lh"><h1>الدروس</h1><p>اتجاه «من الآية»: كل درس آية تقرؤها، والقاعدة تُشرح على حروفها.</p></header>
    <a class="cont" href="#l/${nx}"><small>${Object.keys(S.done).length ? 'تابع' : 'ابدأ'} · ${qt(L.title)}</small><p class="a">${esc(text(L.ayah))}</p>
      <div class="f"><span>سورة ${esc(L.ayah.sura)} · الآية ${AR(L.ayah.a)}</span><b>افتح الدرس</b></div></a>
    ${Z.chapters(ALL).map(c => `<h2 class="chh"><i>${AR(c.no)}</i>${esc(c.title)}</h2><div class="ls">${c.ids.map(id => { const L = LES[id], d = S.done[id];
      return L.ayah ? `<a class="lr${d ? ' done' : ''}" href="#l/${id}"><div><b>${qt(L.title)}</b><span class="c">${esc(L.ayah.sura)} ${AR(L.ayah.a)}</span></div><span class="st">${d ? 'أتممته' : ''}</span></a>`
        : `<div class="lr off"><div><b>${qt(L.title)}</b><span class="c">لا آية له بعد</span></div></div>`; }).join('')}</div>`).join('')}
    <p class="foot">نسخة تجريبية: ${AR(IDS.length)} درسًا من ${AR(D.total)} لها آية. الباقي لا آية له بعد: الفاحص يقرأ اليوم الفاتحة وسبع آيات من المزمل فقط من آيات التطبيق. نصوص القواعد من كتاب «${esc(D.title.join(' '))}». تعليم مواضع القاعدة على حروف الآيات من الموقع، وينتظر مراجعة المؤلفة.<br><a href="../">الاتجاهات الثلاثة</a></p>`;
}
function rows(L) {
  if (grouped(L)) { const gs = {}; L.marks.forEach(m => { (gs[m.group] = gs[m.group] || []).push(m); });
    return Object.entries(gs).map(([g, ms]) => `<div class="rw${g === 'waqf' ? ' wq' : ''}"><span class="n${g === 'waqf' ? ' wq' : ''}"></span>
      <span class="w ${ms.length > 1 ? 'grp' : ''}">${ms.length > 1 ? ms.map(m => esc(L.ayah.w[m.wi][m.ci].c)).join(' ') : wordLit(L, ms[0])}</span><span class="tm">${val(ms[0])}</span><span class="c">${qt(ms[0].rule)}</span></div>`).join(''); }
  return L.marks.map((m, i) => `<div class="rw"><span class="n">${AR(i + 1)}</span><span class="w">${wordLit(L, m)}</span><span class="tm">${val(m)}</span><span class="c">${qt(m.rule)}</span></div>`).join('');
}
function lesson(id) {
  const L = LES[id]; if (!L) return location.hash = '';
  const a = L.ayah, g = grouped(L), m0 = L.marks[0], two = m0.v && m0.v.includes('+'), p = two ? parts(a.w[m0.wi][m0.ci].c) : null;
  app.innerHTML = `<div class="ab"><a class="ib" href="#" aria-label="رجوع إلى الدروس">${I.back}</a><div class="tt"><b>سورة ${esc(a.sura)}</b><span>الآية ${AR(a.a)}</span></div><span style="width:40px"></span></div>
    <div class="body"><span class="kick">الباب ${AR(L.no)} من ٩ · ${esc(L.chapter)}</span>
      <h1 class="h1">${qt(L.title)}</h1>
      <p class="${ayCls(a)}" lang="ar">${ayahHTML(L, m => g ? (m.group === 'waqf' ? 'wq' : 'nb') : '', g ? null : (m, i) => ` data-n="${AR(i + 1)}"`)}</p>
      ${Z.ayahAudio(a) ? `<div class="mine"><button type="button" class="pb" data-hus="${esc(Z.ayahAudio(a))}" aria-label="اسمع الآية">${I.play('#fff', 15)}</button><span class="who">${Z.TMP}</span></div>` : '<div class="nor">لم يُسجَّل صوت القارئ لهذه الآية بعد.</div>'}
      <div class="sec"><b>مواضع القاعدة في الآية</b><span class="pend">تعليم المواضع قيد المراجعة</span></div>
      ${p ? `<div class="split" aria-label="الحرف المشدّد حرفان"><span class="src">${esc(a.w[m0.wi][m0.ci].c)}</span><span class="op">=</span><div class="pt"><span class="g">${esc(p[0])}</span><b>${dots('1.5')}${esc(vName('1.5'))}</b></div><span class="op">+</span><div class="pt"><span class="g">${esc(p[1])}</span><b>${dots('1')}${esc(vName('1'))}</b></div></div>` : ''}
      <div class="rows">${rows(L)}</div>
    </div>
    <div class="dock"><a class="cta" href="#p/${id}">${I.mic}اقرأ الآية</a></div>`;
}

let T = null, EAR = {};
// the long sounds the checker timed, laid on the letters of the ayah: the rows of a word go to its long letters in their order
function onLetters(L, m) {
  const a = L.ayah, out = {};
  a.w.forEach((w, wi) => { const rs = m.rows.filter(r => r.word === wi + 1), cs = w.map((u, ci) => u.k === 'mad' || u.d ? ci : -1).filter(ci => ci >= 0);
    rs.forEach((r, k) => { if (cs[k] != null) out[wi + ':' + cs[k]] = r; }); });
  return out;
}
function measuredView(L, x) {
  const m = Z.measured(T.res, x.ayah);
  if (!m.is) return `<div class="hl">${I.ear}<span><b>لا يبدو أن التسجيل لهذه الآية.</b> اقرأ الآية كاملة ثم أعد.</span></div>`;
  const at = onLetters(L, m), off = m.rows.filter(r => r.st === 'short' || r.st === 'long'), a = L.ayah;
  const ay = a.w.map((w, wi) => w.map((u, ci) => { const r = at[wi + ':' + ci]; return r ? `<em class="${r.st === 'good' ? 'g' : 'w'}" data-g="${r.got == null ? '' : Z.num(r.got)}">${esc(u.c)}</em>` : esc(u.c); }).join('')).join(' ');
  return `<div class="score"><div class="num">${AR(m.good)}<small>/${AR(m.rows.length)}</small></div><p><b>${off.length ? `${AR(m.good)} من الأصوات المدّيّة في زمنها` : 'كل الأصوات المدّيّة في زمنها'}</b>${off.length === 1 ? 'وصوت واحد ليس في زمنه. اللون على الآية يدلّك عليه.' : off.length ? `و${AR(off.length)} ليست في زمنها. اللون على الآية يدلّك عليها.` : 'الرقم تحت كل صوت هو زمنه في تلاوتك بالحركة.'}</p></div>
    <p class="${ayCls(a)}" lang="ar" style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0 14px">${ay}</p>
    ${off.map(r => { const sp = Z.wordSpan(m.symbols, r.word);
      return `<div class="fx" style="margin-bottom:8px"><div class="hd"><span class="w">${esc(r.text)}</span><span>${r.st === 'short' ? 'أقصر' : 'أطول'}</span></div>
      <div class="cmp"><span>في الكتاب</span><div class="cells">${'<i></i>'.repeat(Math.min(6, r.near))}</div><b>${esc(vName(r.v))}</b><span>تلاوتك</span><div class="cells me">${'<i></i>'.repeat(Math.min(8, Math.floor(r.got)))}${r.got % 1 ? '<i style="width:20px"></i>' : ''}</div><b>${Z.num(r.got)}</b></div>
      ${sp ? `<div class="hear" style="grid-template-columns:1fr"><button type="button" data-part="${sp[0]},${sp[1]}">${I.play('#C56A00')}اسمع هذه الكلمة من تلاوتك</button></div>` : ''}</div>`; }).join('')}
    <p class="ai">${esc(Z.NOTE)} يقيس اليوم زمن الأصوات المدّيّة.</p>`;
}
function earView(L, x) {
  const m = T.res ? Z.measured(T.res, x.ayah) : null, sym = m && m.is ? m.symbols : null;
  const places = grouped(L) ? [L.marks.find(k => k.group === 'wasl'), L.marks.find(k => k.group === 'waqf')].filter(Boolean) : L.marks;
  return `<div class="hl">${I.ear}<span><b>قارن بأذنك.</b> ${T.err ? esc(Z.errText(T.err)) + ' ' : m && !m.is ? 'لا يبدو أن التسجيل لهذه الآية. ' : ''}الفاحص لا يقيس هذه القاعدة بعد. اسمع كل موضع من تلاوتك وقابله بنصّ الكتاب.</span></div>
    <p class="${ayCls(L.ayah)}" lang="ar">${ayahHTML(L, m => grouped(L) ? (m.group === 'waqf' ? 'wq' : 'nb') : '', grouped(L) ? null : (m, i) => ` data-n="${AR(i + 1)}"`)}</p>
    ${places.map((k, i) => { const sp = sym ? Z.wordSpan(sym, k.wi + 1) : null, done = EAR[i];
      return `<div class="pc${done ? ' ok' : ''}"><div class="hd"><i>${AR(i + 1)}</i><span class="w">${wordLit(L, k)}</span><b>${val(k)}</b></div><p>${qt(k.rule)}</p>
        <div class="acts"><button type="button" ${sp ? `data-part="${sp[0]},${sp[1]}"` : 'data-mine'}>${I.play('#0E0E10')}${sp ? 'هذا الموضع من تلاوتك' : 'تلاوتك'}</button><button type="button" class="${done ? 'y' : ''}" data-earok="${i}">${done ? I.ok('#fff') : ''}أصبتُ</button><button type="button" data-mic>أعيد</button></div></div>`; }).join('')}`;
}
function practice(id) {
  const L = LES[id]; if (!L) return location.hash = '';
  if (!T || T.L !== L) { EAR = {}; T = Z.sitting(L, [Z.ayahItem(L)], () => { if (route === 'p') draw(); }); T.n = 40; }
  draw();
}
function draw() {
  const L = T.L, x = T.cur(), a = L.ayah;
  if (T.end) { const nx = IDS[IDS.indexOf(L.id) + 1];
    app.innerHTML = `<div class="end"><span class="ok">${I.ok('#0B8A5E', 40)}</span><h1>أتممتَ الدرس</h1><p>${qt(L.title)}</p>${nx ? `<a class="cta" href="#l/${nx}">الدرس التالي</a>` : ''}<a class="back" href="#">إلى الدروس</a></div>`;
    T = null; return; }
  const g = grouped(L), measuredLesson = !!L.measured;
  let body;
  if (T.rec && T.busy) body = `<p class="${ayCls(a)}" lang="ar">${esc(text(a))}</p><div class="nor" role="status">الفاحص يسمع تلاوتك…</div>`;
  else if (T.rec && T.res && measuredLesson) body = measuredView(L, x);
  else if (T.rec && (T.res || T.err)) body = earView(L, x);
  else body = `<span class="kick">${qt(L.title)}</span><p class="${ayCls(a)}" lang="ar" style="margin-top:14px">${ayahHTML(L, m => g ? (m.group === 'waqf' ? 'wq' : 'nb') : '', g ? null : (m, i) => ` data-n="${AR(i + 1)}"`)}</p>
      ${T.on ? '<div class="recng" role="status"><i></i>يُسجَّل الآن. اقرأ الآية ثم أوقف.</div>' : `<div class="nor">اقرأ الآية كاملة بصوت واضح. ${measuredLesson ? 'يقيس الفاحص أصواتها المدّيّة ويعلّم عليها.' : 'يحدّد الفاحص مواضع كلماتها في تلاوتك لتسمع كل موضع.'}</div>`}
      ${T.msg ? `<div class="nor" role="alert" style="margin-top:8px">${esc(T.msg)}</div>` : ''}${!Z.canRec ? '<div class="nor" style="margin-top:8px">هذا المتصفح لا يسجّل الصوت. افتح الصفحة في Safari أو Chrome.</div>' : ''}`;
  app.innerHTML = `<div class="ab"><a class="ib" href="#l/${L.id}" aria-label="رجوع إلى الشرح">${I.back}</a><div class="tt"><b>تلاوتك</b><span>${esc(a.sura)} ${AR(a.a)}</span></div><span style="width:40px"></span></div>
    <div class="body">${body}
      ${Z.ayahAudio(a) ? `<div class="mine"><button type="button" class="pb" data-hus="${esc(Z.ayahAudio(a))}" aria-label="اسمع الآية">${I.play('#fff', 15)}</button><span class="who">${Z.TMP}</span></div>` : ''}
      ${T.rec ? `<div class="mine"><button type="button" class="pb" data-mine aria-label="اسمع تلاوتك">${I.play('#fff', 15)}</button><div class="wv">${Z.wave(T.rec.pk, { n: 40, h: 30, c: '#0E0E10' })}</div><span class="who">تلاوتك</span></div>` : ''}
    </div>
    <div class="dock"><button type="button" class="cta${T.on ? ' on' : ''}" data-mic>${T.on ? I.stop + 'أوقف' : I.mic + (T.rec ? 'اقرأ الآية مرة أخرى' : 'اقرأ الآية')}</button>${T.rec && !T.busy ? '<button type="button" class="alt" data-next>أنهِ الدرس</button>' : ''}</div>`;
}

let route = '';
function render() {
  const [a, b] = (location.hash || '#').slice(1).split('/');
  Z.stop(); route = a || 'list';
  if (a !== 'p' && T) { if (T.on) T.mic(); T = null; }
  if (a === 'l') lesson(b); else if (a === 'p') practice(b); else list();
  if (a !== 'p' || !T || !T.rec) window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const t = e.target;
  const hz = t.closest('[data-hus]'); if (hz) return Z.play(hz.dataset.hus);
  if (!T) return;
  if (t.closest('[data-mic]')) { EAR = {}; return T.mic(); }
  if (t.closest('[data-mine]')) return Z.play(T.rec.url);
  const pt = t.closest('[data-part]'); if (pt) { const [f, to] = pt.dataset.part.split(',').map(Number); return Z.play(T.rec.url, { from: Math.max(0, f - .15), to: to + .2 }); }
  const eo = t.closest('[data-earok]'); if (eo) { EAR[eo.dataset.earok] = 1; return draw(); }
  if (t.closest('[data-next]')) return T.next();
});
addEventListener('hashchange', render);
render();
window.__t = () => T;
})();
</script></body></html>
