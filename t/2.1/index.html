<!doctype html><html lang="ar" dir="rtl" data-v="2.1"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="color-scheme" content="dark">
<title>زِنِ الحَرْفَ · صورة الصوت ١٫١ (نسخة تجريبية)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="look.css?v=f97ba99">
<style>
/* «صورة الصوت» 1.1: the second version's way (the letter's time drawn, your voice under the reader's), on the third's calm screen:
   a short bar at the top, the ayah as the text to read, the exercise's word marked in it, and no verdict. The two voices are drawn on
   one scale of time, so a longer reading is a longer drawing; where the checker finds the exercise's word, it is lit on yours */
@font-face{font-family:ZinQ;src:url(../assets/zinq.woff2) format("woff2");font-display:block}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#0B0D11}
body{margin:0;background:var(--bg);font-family:"Noto Kufi Arabic",system-ui,sans-serif;color:var(--tx);direction:rtl;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.q{font-family:ZinQ;font-weight:400;letter-spacing:0}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--am);outline-offset:2px;border-radius:12px}
.lh{padding:22px 20px 4px}
.lh h1{margin:0;font-size:28px;font-weight:700;line-height:1.5}
.lh p{margin:2px 0 0;font-size:13px;color:var(--tx2);line-height:1.9}
.cont{margin:12px 16px 14px;padding:16px;border-radius:22px;background:var(--s1);border:1px solid var(--am);display:grid;grid-template-columns:auto 1fr;gap:0 14px;align-items:center}
.cont .go{grid-row:1/3;width:52px;height:52px;border-radius:50%;background:var(--am);display:grid;place-items:center}
.cont small{font-size:12px;color:var(--tx2)}
.cont b{font-size:14.5px;font-weight:600;line-height:1.7}
.cont b .q{font-size:1.15em}
.ls{padding:0 16px}
.lr{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-height:66px}
.lr .gl{width:44px;height:44px;border-radius:13px;background:var(--s2);color:var(--am);font-family:ZinQ;font-size:22px;line-height:1;display:grid;place-items:center;padding-bottom:5px;overflow:hidden}
.lr b{display:block;font-size:13.5px;font-weight:600;line-height:1.7}
.lr b .q{font-size:1.15em}
.lr .st{font-size:12px;font-weight:600;color:var(--tx2);white-space:nowrap}
.lr.done .st,.lr.done .gl{color:var(--mi)}
.chh{display:flex;align-items:baseline;gap:10px;margin:24px 20px 4px;font-size:13.5px;font-weight:600;line-height:1.7;color:var(--tx2)}
.chh i{font-style:normal;flex:none;font-size:17px;font-weight:700;color:var(--am)}
.foot{padding:18px 20px 30px;font-size:12px;line-height:2;color:var(--tx2)}
.foot a{text-decoration:underline;display:inline-flex;align-items:center;min-height:44px;font-weight:600}
.ab{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 16px}
.ab .tt b{font-size:15px;line-height:1.5}
.ab .tt span{font-size:12px}
.body{flex:1;padding:4px 16px 12px;display:flex;flex-direction:column;gap:12px}
.lt{margin:0;font-size:21px;font-weight:700;line-height:1.6}
.lt .q{font-size:1.15em}
.card h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--tx2);display:flex;align-items:center;justify-content:space-between}
/* the time of the letter, drawn: one cell for each حركة */
.tr{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.tr:first-of-type{border-top:0;padding-top:0}
.tr .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tr .w{font-family:ZinQ;font-size:clamp(24px,7vw,29px);line-height:1.7}
.tr .w em{font-style:normal;color:var(--am)}
.tr .w em.gh{color:var(--tx3)}
.cx{flex:none;font-size:12px;font-weight:600;padding:2px 11px;border-radius:99px;background:var(--mi-s);color:var(--mi)}
.cx.waqf{background:var(--am-s);color:var(--am)}
.cx.v{background:var(--s2);color:var(--tx)}
.cx.ibtida{background:var(--s2);color:var(--mi)}
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.tb .cells{display:flex;gap:4px;direction:rtl}
.tb .cells i{width:calc(var(--u) * .8);height:16px;border-radius:5px;background:var(--am)}
.tb .cells i.hf{width:calc(var(--u) * .4)}
.tb .cells i.op{background:transparent;box-shadow:inset 0 0 0 1.5px var(--am);opacity:.7}
.tb .cells i.z{background:transparent;border:1.5px dashed var(--tx3)}
.tb .lb{font-size:13px;font-weight:600;color:var(--am)}
.tb .g{font-family:ZinQ;font-size:22px;line-height:1.3;color:var(--tx);min-width:26px;text-align:center}
.said{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx2)}
.said .q{font-size:21px;color:var(--tx);line-height:1.6}
.book p{margin:0}
.book{font-size:13.5px;line-height:1.95;color:var(--tx);padding:0 4px}
.book b{color:var(--am);font-weight:600}
.book .q{font-size:1.2em}
.book .u{margin-top:6px;color:var(--tx2)}
/* the text to read */
.how{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0;font-size:13px;color:var(--tx2);line-height:1.8}
.ay{margin:0;font-size:clamp(26px,8.4vw,34px);line-height:2.15}
.ay.long{font-size:clamp(24px,6.6vw,28px)}
.ay .ex{text-decoration:underline;text-decoration-color:var(--am);text-decoration-thickness:2px;text-underline-offset:12px}
.ay em{font-style:normal;color:var(--am)}
.ay em.gh{color:var(--tx3)}
.an{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:99px;border:1.5px solid var(--tx3);font:600 12px/1 "Noto Kufi Arabic",sans-serif;color:var(--tx2);vertical-align:middle}
/* the two voices on one scale of time */
.tk{display:grid;gap:4px}
.tk .hd{display:flex;align-items:center;justify-content:space-between;min-height:28px;font-size:12.5px;color:var(--tx2)}
.tk .hd b{font-weight:600;color:var(--tx)}
.tk .wv{display:flex;justify-content:flex-start;min-height:44px;align-items:center}
.tk .wv .wsvg{height:44px;display:block}
.nor{padding:8px 12px;border-radius:12px;background:var(--s2);color:var(--tx2);font-size:12.5px;line-height:1.8}
.recng{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;color:var(--rec)}
.recng i{width:10px;height:10px;border-radius:50%;background:var(--rec);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
/* after a reading: the ear decides */
.ear p{margin:0;font-size:13.5px;line-height:1.9}
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tp button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;border-radius:14px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:500;padding:0 6px;text-align:center;line-height:1.4}
.tp button[disabled]{opacity:.35}
.tp .y{grid-column:1/-1;background:var(--mi-s);border-color:transparent;color:var(--mi);font-weight:600}
.small{font-size:12px;color:var(--tx2);line-height:1.8;margin:8px 0 0}
.rec{position:sticky;bottom:0;margin-top:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 24%)}
.rb{width:70px;height:70px}
.rb.on i{border-radius:10px;width:30px;height:30px}
.rec .l{font-size:12.5px;color:var(--tx2);line-height:1.6}
.rec .r{justify-self:end;display:flex;align-items:center;gap:6px;min-height:48px;min-width:48px;justify-content:flex-end;font-size:13.5px;font-weight:600}
.dock{position:sticky;bottom:0;margin-top:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 26%)}
.cta{width:100%}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;gap:8px}
.end .ok{width:86px;height:86px;border-radius:50%;background:var(--mi-s);display:grid;place-items:center}
.end h1{margin:10px 0 0;font-size:24px}
.end p{margin:0;color:var(--tx2);font-size:13.5px;line-height:2}
.end .cta{margin-top:18px}
.end a.back{margin-top:10px;font-size:13.5px;font-weight:600;color:var(--am);min-height:44px;display:flex;align-items:center}
@media (max-width:330px){.rec{grid-template-columns:auto 1fr;gap:10px}.rec .l{display:none}.rec .r{justify-self:start}}
@media (prefers-reduced-motion:reduce){.recng i{animation:none}}
</style></head><body>
<div class="app" id="app"></div>
<script src="../assets/data.js?v=f97ba99"></script><script src="../assets/zf-forms.js?v=f97ba99"></script><script src="../assets/reciter.js?v=f97ba99"></script><script src="../assets/ayat.js?v=f97ba99"></script><script src="../assets/zf.js?v=f97ba99"></script><script src="../assets/core.js?v=f97ba99"></script>
<script>
(() => {
const { D, $, esc, AR, CTX, LES, vName, lit, qt, glyph, parts } = Z, app = $('#app');
const IDS = D.lessons.map(l => l.id), no = id => AR(IDS.indexOf(id) + 1), AM = '#FFB01F', MI = '#3FE0BF', G1 = '#8C94A1';
const I = {
  back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5F2EA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
  mic: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1203" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  play: (c, s = 15) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>`,
  ok: (c, s = 15) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>`,
  nxt: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5F2EA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>',
};
const mark = s => qt(s).replace(/(بزمن\s*=\s*)(\(?\s*\d[^)]*\)\s*حرك\S*|حركة(?: واحدة)?\s*\+\s*بعض حركة|حركة واحدة|حركتان|\d+\s*حركات|حركة)/g, '$1<b>$2</b>').replace(/(لا تُلفظ)/g, '<b>$1</b>');
// the time of a letter as cells on one scale: a cell for each حركة, half a cell for «بعض حركة», an empty one for a letter not said;
// «2 أو 4 أو 6» as two cells and four open ones, the lengths the reader may choose
const cellsOf = v => v === '2|4|6' ? '<i></i><i></i>' + '<i class="op"></i>'.repeat(4) : (n => n ? '<i></i>'.repeat(Math.floor(n)) + (n % 1 ? '<i class="hf"></i>' : '') : '<i class="z"></i>')(Number(v));
function timeBar(x) {
  if (x.kind !== 'time' || x.v == null) return x.kind === 'verdict' || x.kind === 'form' || x.kind === 'start' ? `<div class="tb"><span class="lb">${esc(x.ans)}</span></div>` : '';
  if (x.v.includes('+')) { const p = parts(glyph(x)), v = x.v.split('+');
    return `<div class="tb" role="img" aria-label="${esc(vName(x.v))}"><span class="g">${esc(p[0])}</span><span class="cells">${cellsOf(v[0])}</span><span class="g">${esc(p[1])}</span><span class="cells">${cellsOf(v[1])}</span><span class="lb">${esc(vName(x.v))}</span></div>`; }
  return `<div class="tb"><span class="g">${esc(glyph(x))}</span><span class="cells" role="img" aria-label="${esc(vName(x.v))}">${cellsOf(x.v)}</span><span class="lb">${esc(vName(x.v))}</span></div>`;
}
const litWord = x => lit(x.w, x.f, x.v === '0' ? 'gh' : '');
const chip = x => x.ctx ? `<span class="cx ${x.ctx}">${CTX[x.ctx]}</span>` : '';
const said = x => { const s = Z.saidOf(x); return s && x.kind !== 'form' && x.kind !== 'start' ? `<div class="said"><span>${Z.saidLabel(x)}</span><span class="q">${esc(s)}</span></div>` : ''; };
const ayahMarks = x => { const at = new Set((x.marks || []).map(m => m.wi + ':' + m.ci));
  return x.ayah.w.map((w, wi) => w.map((u, ci) => at.has(wi + ':' + ci) ? `<em>${esc(u.c)}</em>` : esc(u.c)).join('')).join(' '); };

function list() {
  const S = Z.S(), nx = IDS.find(id => !S.done[id]) || IDS[0];
  app.innerHTML = `<header class="lh"><h1>الدروس</h1><p>اتجاه «صورة الصوت» ١٫١: ترى زمن الحرف مرسومًا، وترى صوتك تحت صوت القارئ.</p></header>
    <a class="cont" href="#l/${nx}"><span class="go">${I.play('#1A1203', 20)}</span><small>${Object.keys(S.done).length ? 'تابع' : 'ابدأ'} · الدرس ${no(nx)}</small><b>${qt(LES[nx].title)}</b></a>
    ${Z.chapters(IDS).map(c => `<h2 class="chh"><i>${AR(c.no)}</i>${esc(c.title)}</h2><div class="ls">${c.ids.map(id => { const L = LES[id], d = S.done[id];
      return `<a class="lr${d ? ' done' : ''}" href="#l/${id}"><span class="gl" aria-hidden="true">${esc(glyph(L.cases[0].items[0]))}</span><div><b>${qt(L.title)}</b></div><span class="st">${d ? 'أتممته' : ''}</span></a>`; }).join('')}</div>`).join('')}
    <p class="foot">نسخة تجريبية: «صورة الصوت» بما استحسنّاه من «من الآية»، وهو شاشة هادئة، والآية هي النص المقروء، والفاحص يجد موضع الكلمة ولا يحكم. والصوتان مرسومان بمقياس زمن واحد. ${AR(IDS.length)} درسًا. نصوص القواعد والأمثلة من كتاب «${esc(D.title.join(' '))}».<br><a href="../">النسخ التجريبية</a></p>`;
}
function lesson(id) {
  const L = LES[id]; if (!L) return location.hash = '';
  const ex = L.cases.map(c => c.items[0]), timed = ex.some(x => x.kind === 'time');
  app.innerHTML = `<div class="ab"><a class="bk" href="#" aria-label="رجوع إلى الدروس">${I.back}</a><div class="tt"><b>الدرس ${no(id)}</b><span>الباب ${AR(L.no)} من ٩</span></div></div>
    <div class="body"><h1 class="lt">${qt(L.title)}</h1>
      <div class="book">${Z.ruleLines(L).map(t => `<p>${mark(t)}</p>`).join('')}${id === 'L0' ? `<p class="u">${esc(D.unit)}</p>` : ''}</div>
      <div class="card"><h3><span>${timed ? 'زمن الحرف المضيء' : 'الحرف المضيء'}</span>${timed ? '<span>الخانة = حركة</span>' : ''}</h3>
        ${ex.map(x => `<div class="tr"><div class="hd"><span class="w" lang="ar">${litWord(x)}</span>${chip(x)}</div>${timeBar(x)}${said(x)}</div>`).join('')}
      </div>
    </div>
    <div class="dock"><a class="cta" href="#p/${id}">${I.mic}سجّل صوتك وقارن</a></div>`;
}

let T = null;
// a recording drawn on the scale `max` (seconds): its width is its own length, so a longer reading is a longer drawing
function track(pk, max, c, zones) {
  const len = pk ? pk.to - pk.from : 0, w = pk && max ? Math.max(12, Math.round(100 * len / max)) : 100;
  return `<div class="wv"><div style="width:${w}%">${Z.wave(pk, { n: Math.max(12, Math.round(60 * w / 100)), h: 44, bw: 3, gap: 2, c, zones })}</div></div>`;
}
function voices(x) {
  const rpk = T.readerPk(), mpk = T.rec && T.rec.pk, max = Math.max(rpk ? rpk.to - rpk.from : 0, mpk ? mpk.to - mpk.from : 0);
  const rd = T.reader();
  return `<div class="card tk"><div class="hd"><b>${x.recited ? Z.TMP : 'القارئ'}</b><span>${rd ? '' : 'لم يُسجَّل صوته لهذا المثال بعد'}</span></div>
      ${rd ? track(rpk, max, AM) : ''}
      ${T.rec ? `<div class="hd"><b style="color:var(--mi)">صوتك</b><span>${T.span ? 'المضيء: الكلمة في تلاوتك' : ''}</span></div>${track(mpk, max, T.span ? '#5B6370' : MI, T.span ? [{ a: T.span[0], b: T.span[1], c: MI }] : [])}` : ''}
    </div>`;
}
function ear(x) {
  if (!T.rec) return '';
  const rd = T.reader(), find = Z.canLocate(x);
  return `<div class="card ear"><p>${rd ? 'اسمع القارئ ثم صوتك، وانظر الرسمين: هل قرأتَ مثله؟' : 'اسمع صوتك وقابله بالقاعدة: هل أصبتَ؟'}</p>
    <div class="tp"><button type="button" data-rd ${rd ? '' : 'disabled'}>${I.play(AM, 13)}القارئ</button><button type="button" data-mine>${I.play(MI, 13)}${T.span ? 'الكلمة من صوتك' : 'صوتك'}</button><button type="button" data-both ${rd ? '' : 'disabled'}>${I.play('#F5F2EA', 13)}الاثنان</button>
      <button type="button" class="y" data-ok>${I.ok(MI)}أصبتُ</button></div>
    ${T.finding ? '<p class="small" role="status">يبحث الفاحص عن الكلمة في تلاوتك…</p>' : T.err ? `<p class="small">${esc(Z.errText(T.err))} فاسمع تلاوتك كاملة.</p>` : T.looked && !T.span ? '<p class="small">لم يجد الفاحص الكلمة في تلاوتك، فاسمعها كاملة.</p>' : ''}
    ${find ? '<p class="small">الفاحص هنا يجد موضع الكلمة في تلاوتك فقط، ولا يحكم عليها.</p>' : ''}</div>`;
}
function practice(id) {
  const L = LES[id]; if (!L) return location.hash = '';
  if (!T || T.L !== L) { T = Z.sitting(L, Z.examples(L), () => { if (route === 'p') draw(); }, { ear: true }); T.n = 60; T.load(); }
  draw();
}
function draw() {
  const L = T.L, x = T.cur(), n = T.items.length;
  if (T.end) { const nx = IDS[IDS.indexOf(L.id) + 1];
    app.innerHTML = `<div class="end"><span class="ok">${I.ok(MI, 40)}</span><h1>أتممتَ الدرس</h1><p>${qt(L.title)}</p>${nx ? `<a class="cta" href="#l/${nx}">الدرس التالي</a>` : ''}<a class="back" href="#">إلى الدروس</a></div>`;
    T = null; return; }
  const text = x.ay ? Z.ayahLit(x) : x.kind === 'ayah' ? ayahMarks(x) : litWord(x), len = (x.ay ? x.ay.text : x.w).length;
  const how = x.ay ? Z.ayahLabel(x) : x.kind === 'ayah' ? `اقرأ الآية كاملة: ${esc(x.ayah.sura)} ${AR(x.ayah.a)}` : 'اقرأ';
  app.innerHTML = `<div class="ab"><a class="bk" href="#l/${L.id}" aria-label="رجوع إلى الشرح">${I.back}</a><div class="tt"><b>الدرس ${no(L.id)}</b><span>${AR(T.i + 1)} من ${AR(n)}</span></div></div>
    <div class="body">
      <p class="how">${how}${chip(x)}</p>
      <p class="ay q${len > 60 ? ' long' : ''}" lang="ar">${text}</p>
      ${x.kind !== 'ayah' ? `${timeBar(x)}${said(x)}` : ''}
      ${voices(x)}
      ${T.on ? '<div class="recng" role="status"><i></i>يُسجَّل الآن. اقرأ ثم أوقف.</div>' : ''}
      ${T.msg ? `<div class="nor" role="alert">${esc(T.msg)}</div>` : ''}
      ${!Z.canRec ? '<div class="nor">هذا المتصفح لا يسجّل الصوت. افتح الصفحة في Safari أو Chrome.</div>' : ''}
      ${ear(x)}
    </div>
    <div class="rec"><span class="l">${T.on ? 'أوقف حين تنتهي' : T.rec ? 'سجّل مرة أخرى' : 'اضغط وسجّل'}</span><button type="button" class="rb${T.on ? ' on' : ''}" data-mic aria-label="${T.on ? 'أوقف التسجيل' : 'سجّل'}"><i></i></button><button type="button" class="r" data-next>${T.i + 1 < n ? 'التالية' : 'أنهِ الدرس'}${I.nxt}</button></div>`;
}

let route = '';
function render() {
  const [a, b] = (location.hash || '#').slice(1).split('/');
  Z.stop(); route = a || 'list';
  if (a !== 'p' && T) { if (T.on) T.mic(); T = null; }
  if (a === 'l') lesson(b); else if (a === 'p') practice(b); else list();
  if (a !== 'p' || !T || !T.rec) window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const t = e.target;
  if (!T) return;
  if (t.closest('[data-mic]')) return T.mic();
  if (t.closest('[data-rd]')) return Z.play(T.reader());
  if (t.closest('[data-mine]')) return T.span ? Z.play(T.rec.url, { from: Math.max(0, T.span[0] - .15), to: T.span[1] + .2 }) : Z.play(T.rec.url);
  if (t.closest('[data-both]')) return Z.playBoth(T.reader(), T.rec.url);
  if (t.closest('[data-ok]') || t.closest('[data-next]')) return T.next();
});
addEventListener('hashchange', render);
render();
window.__t = () => T;
})();
</script></body></html>
