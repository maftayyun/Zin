<!doctype html><html lang="ar" dir="rtl" data-v="4"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>زِنِ الحَرْفَ · الجامعة (نسخة تجريبية)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="look.css?v=4aa382d">
<style>
/* «الجامعة»: the best of the three, as the council found them.
   From «من الآية»: the calm screen, a short bar at the top, the ayah as the text to read, the checker only finding the word.
   From «تلقّي»: hear the reader, read after him, hear the two voices; every lesson of the book in her order, with her examples
   and the way each is said («تُلفظ»).
   From «صورة الصوت»: the letter's time as cells, one for each حركة, from the example's own value; the two voices on one scale.
   And from the conditions: the lesson ends on an ayah read without marks, which appear after it is read. */
@font-face{font-family:ZinQ;src:url(../assets/zinq.woff2) format("woff2");font-display:block}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);font-family:"Noto Sans Arabic",system-ui,sans-serif;color:var(--ink);direction:rtl;line-height:1.7;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.q{font-family:ZinQ;font-weight:400;letter-spacing:0}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:12px}
:root{--mute:#62636A}
/* the list */
.lh{padding:20px 22px 0}
.lh h1{margin:0;font-family:"Markazi Text",serif;font-size:46px;font-weight:700;line-height:1.1}
.lh p{margin:4px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.8}
.cont{display:block;margin:14px 22px 8px;padding:14px 16px;border-radius:24px;background:var(--tint)}
.cont small{font-size:12.5px;font-weight:600;color:var(--ac)}
.cont b{display:block;font-size:16px;font-weight:600;line-height:1.6}
.cont b .q{font-size:1.15em}
.cont .f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.cont .f span{font-size:12.5px;color:var(--mute)}
.cont .f i{font-style:normal;display:flex;align-items:center;min-height:44px;padding:0 18px;border-radius:99px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.chh{display:flex;align-items:baseline;gap:10px;margin:26px 22px 2px;font-size:14.5px;font-weight:600;line-height:1.6;color:var(--ink2)}
.chh i{font-style:normal;flex:none;font-family:"Markazi Text",serif;font-size:28px;font-weight:700;line-height:1;color:var(--ac)}
.ls{padding:0 22px}
.lr{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-height:62px}
.lr .gl{font-family:ZinQ;font-size:26px;line-height:1;color:var(--ac);text-align:center;padding-bottom:6px}
.lr b{display:block;font-size:14.5px;font-weight:600;line-height:1.55}
.lr b .q{font-size:1.15em}
.lr .st{font-size:12.5px;font-weight:600;color:var(--mute);white-space:nowrap}
.lr.done .gl,.lr.done .st{color:var(--ok)}
.foot{padding:18px 22px 30px;font-size:12.5px;line-height:1.9;color:var(--mute)}
.foot a{text-decoration:underline;display:inline-flex;align-items:center;min-height:44px;font-weight:600}
/* the bar at the top: where you are, in a few words, and how far through the lesson */
.ab{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 18px 6px;flex-wrap:wrap}
.ab .ib{background:#fff}
.ab .tt b{font-size:15px}
.ab .tt span{font-size:12px;color:var(--mute)}
.pr{flex-basis:100%;height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.pr i{display:block;height:100%;background:var(--ac);border-radius:2px}
.body{flex:1;padding:6px 22px 14px;display:flex;flex-direction:column;gap:12px;overflow:visible}
/* a lesson */
.kick{font-size:12.5px;font-weight:600;color:var(--ac)}
.h1{margin:0;font-family:"Markazi Text",serif;font-size:clamp(30px,8.6vw,38px);font-weight:700;line-height:1.2}
.h1 .q{font-family:ZinQ;font-size:.7em;font-weight:400}
.rule{margin:0;padding:2px 14px 2px 0;border-right:3px solid var(--ac);font-size:15px;line-height:1.95}
.rule p{margin:0}
.rule b{color:var(--ac);font-weight:700}
.rule .q{font-size:1.25em}
.rule .u{color:var(--ink2);font-size:13.5px;margin-top:4px}
.tbl{border:1.5px solid var(--line);border-radius:20px;padding:4px 14px}
.tbl h2{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 2px;font-size:13px;font-weight:600;color:var(--ink2)}
.tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.tr:first-of-type{border-top:0}
.tr .w{font-family:ZinQ;font-size:clamp(24px,7vw,28px);line-height:1.7}
.tr .w em,.place em{font-style:normal;color:var(--ac)}
.tr .w em.gh,.place em.gh{color:var(--ink3)}
.tr .sub{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:var(--ink2)}
.tr .sub .q,.place .q{font-size:21px;color:var(--ink);line-height:1.6}
.cx{flex:none;font-size:12px;font-weight:600;padding:1px 10px;border-radius:99px;background:var(--ac-s);color:var(--ac)}
.cx.waqf{background:var(--wa-s);color:#8A4A00}
.cx.ibtida{background:var(--ok-s);color:var(--ok)}
.vd{font-size:13px;font-weight:600;padding:1px 10px;border-radius:99px;background:var(--tint)}
/* a letter's time: one cell for each حركة, half a cell for «بعض حركة», an empty one for a letter not said */
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px;font-weight:600}
.cells{display:flex;gap:4px;direction:rtl}
.cells i{width:26px;height:12px;border-radius:4px;background:var(--ac)}
.cells i.hf{width:13px}
.cells i.op{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ac);opacity:.6}
.cells i.z{background:transparent;border:1.5px dashed var(--ink3)}
.tb .g{font-family:ZinQ;font-size:21px;line-height:1.3;font-weight:400}
/* the text to read */
.how{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0;font-size:13.5px;color:var(--ink2);line-height:1.8}
.ay{margin:0;font-family:ZinQ;font-size:clamp(26px,8.4vw,36px);line-height:2.15;text-align:center}
.ay.long{font-size:clamp(24px,6.6vw,29px)}
.ay .ex{text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:2px;text-underline-offset:12px}
.ay em{font-style:normal;color:var(--ac)}
.ay em::after{content:none;display:none}
.ay em.gh{color:var(--ink3)}
.an{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:99px;border:1.5px solid var(--ink3);font:600 12px/1 "Noto Sans Arabic",sans-serif;color:var(--ink2);vertical-align:middle}
.place{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;padding:8px 12px;border-radius:16px;background:var(--tint)}
.test{padding:10px 14px;border-radius:16px;background:var(--ac-s);color:#1B2596;font-size:14px;line-height:1.8}
.pl{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 14px;border-radius:99px;background:var(--tint);direction:ltr}
.pl .pb{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.pl .who{flex:1;min-width:0;font-size:13px;font-weight:600;direction:rtl}
.pl .who small{display:block;font-size:12px;font-weight:500;color:var(--mute)}
.nor{padding:9px 14px;border-radius:14px;background:var(--tint);color:var(--ink2);font-size:13px;line-height:1.8}
.recng{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;color:#B02A17}
.recng i{width:10px;height:10px;border-radius:50%;background:#C4321C;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
/* after a reading: the two voices on one scale of time, and the ear decides */
.ear{border:1.5px solid var(--line);border-radius:20px;padding:12px 14px;display:grid;gap:8px}
.ear p{margin:0;font-size:14px;line-height:1.85}
.tk{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--ink2)}
.tk b{font-weight:600;color:var(--ink);white-space:nowrap}
.tk .wv{display:flex;justify-content:flex-start;min-width:0}
.tk .wv .wsvg{height:34px;display:block}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;padding:0 10px}
.acts button.y{grid-column:1/-1;background:var(--ok);border-color:var(--ok);color:#fff}
.small{margin:0;font-size:12.5px;color:var(--mute);line-height:1.75}
.dock{position:sticky;bottom:0;margin-top:auto;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 22px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 24%)}
.dock.one{grid-template-columns:1fr}
.dock .cta{min-width:0;height:56px}
.dock .cta.on{background:#B02A17}
.dock .alt{white-space:nowrap;height:56px;background:#fff}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;gap:8px}
.end .ok{width:86px;height:86px;border-radius:50%;background:var(--ok-s);display:grid;place-items:center}
.end h1{margin:10px 0 0;font-family:"Markazi Text",serif;font-size:38px;line-height:1.2}
.end p{margin:0;color:var(--ink2);font-size:14px}
.end .cta{margin-top:18px;padding:0 28px}
.end a.back{margin-top:10px;font-size:14px;font-weight:600;color:var(--ac);min-height:44px;display:flex;align-items:center}
@media (max-width:330px){.dock{padding-left:14px;padding-right:14px}.dock .alt{padding:0 12px}}
@media (prefers-reduced-motion:reduce){.recng i{animation:none}}
</style></head><body>
<div class="app" id="app"></div>
<script src="../assets/data.js?v=4aa382d"></script><script src="../assets/zf-forms.js?v=4aa382d"></script><script src="../assets/reciter.js?v=4aa382d"></script><script src="../assets/ayat.js?v=4aa382d"></script><script src="../assets/zf.js?v=4aa382d"></script><script src="../assets/core.js?v=4aa382d"></script>
<script>
(() => {
const { D, $, esc, AR, CTX, LES, vName, lit, qt, glyph, parts } = Z, app = $('#app');
const IDS = D.lessons.map(l => l.id), no = id => AR(IDS.indexOf(id) + 1);
const I = {
  back: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
  mic: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  stop: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="#fff"/></svg>',
  play: (c, s = 14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>`,
  ok: (c, s = 14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>`,
  both: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5v14l8-7zM18 5v14"/></svg>',
};
const mark = s => qt(s).replace(/(بزمن\s*=\s*)(\(?\s*\d[^)]*\)\s*حرك\S*|حركة(?: واحدة)?\s*\+\s*بعض حركة|حركة واحدة|حركتان|\d+\s*حركات|حركة)/g, '$1<b>$2</b>').replace(/(لا تُلفظ)/g, '<b>$1</b>');
const cellsOf = v => v === '2|4|6' ? '<i></i><i></i>' + '<i class="op"></i>'.repeat(4) : (n => n ? '<i></i>'.repeat(Math.floor(n)) + (n % 1 ? '<i class="hf"></i>' : '') : '<i class="z"></i>')(Number(v));
// the lit letter's time from the example's own value: a doubled letter as its two letters, each with its time
function timeOf(x) {
  if (x.kind === 'verdict') return `<span class="vd">${esc(x.ans)}</span>`;
  if (x.kind !== 'time' || x.v == null) return '';
  if (x.v.includes('+')) { const p = parts(glyph(x)), v = x.v.split('+');
    return `<span class="tb" role="img" aria-label="${esc(vName(x.v))}"><span class="g">${esc(p[0])}</span><span class="cells">${cellsOf(v[0])}</span><span class="g">${esc(p[1])}</span><span class="cells">${cellsOf(v[1])}</span>${esc(vName(x.v))}</span>`; }
  return `<span class="tb"><span class="cells" role="img" aria-label="${esc(vName(x.v))}">${cellsOf(x.v)}</span>${esc(vName(x.v))}</span>`;
}
const said = x => { const s = Z.saidOf(x); return s ? `<span>${Z.saidLabel(x)}</span><span class="q" lang="ar">${esc(s)}</span>` : ''; };
const chip = x => x.ctx ? `<span class="cx ${x.ctx}">${CTX[x.ctx]}</span>` : '';
const litWord = x => lit(x.w, x.f, x.v === '0' ? 'gh' : '');

/* ---------- what a lesson practises: her examples, each in its ayah; the last of them read without marks ---------- */
function steps(L) {
  const all = Z.examples(L).filter(x => x.kind !== 'ayah');
  const k = all.map(x => !!(x.ay && !x.ay.part)).lastIndexOf(true);   // the closing test: a whole ayah, the marks after the reading
  if (k < 1) return all;
  const test = Object.assign({}, all[k], { test: true });
  return all.filter((_, i) => i !== k).concat([test]);
}

function list() {
  const S = Z.S(), nx = IDS.find(id => !S.done[id]) || IDS[0], L = LES[nx];
  app.innerHTML = `<header class="lh"><h1>الدروس</h1><p>النسخة الجامعة: تسمع القارئ، وتقرأ الآية بعده، وترى زمن الحرف، وتسمع صوتك مع صوته.</p></header>
    <a class="cont" href="#l/${nx}"><small>${Object.keys(S.done).length ? 'تابع' : 'ابدأ'} · الدرس ${no(nx)}</small><b>${qt(L.title)}</b>
      <div class="f"><span>الباب ${AR(L.no)} من ٩ · ${esc(L.chapter)}</span><i>افتح الدرس</i></div></a>
    ${Z.chapters(IDS).map(c => `<h2 class="chh"><i>${AR(c.no)}</i>${esc(c.title)}</h2><div class="ls">${c.ids.map(id => { const L = LES[id], d = S.done[id];
      return `<a class="lr${d ? ' done' : ''}" href="#l/${id}"><span class="gl" aria-hidden="true">${esc(glyph(L.cases[0].items[0]))}</span><div><b>${qt(L.title)}</b></div><span class="st">${d ? 'أتممته' : ''}</span></a>`; }).join('')}</div>`).join('')}
    <p class="foot">نسخة تجريبية جامعة لأحسن ما في النسخ الثلاث: شاشة «من الآية» الهادئة والآية نصًّا مقروءًا، وسماع القارئ والصوتين من «تلقّي»، وزمن الحرف خاناتٍ من «صورة الصوت». الفاحص يجد موضع الكلمة في تلاوتك ولا يحكم عليها. ${AR(IDS.length)} درسًا. نصوص القواعد والأمثلة من كتاب «${esc(D.title.join(' '))}».<br><a href="../">النسخ التجريبية</a></p>`;
}
function lesson(id) {
  const L = LES[id]; if (!L) return location.hash = '';
  const ex = L.cases.map(c => c.items[0]), timed = ex.some(x => x.kind === 'time');
  app.innerHTML = `<div class="ab"><a class="ib" href="#" aria-label="رجوع إلى الدروس">${I.back}</a><div class="tt"><b>الدرس ${no(id)}</b><span>الباب ${AR(L.no)} من ٩</span></div><span style="width:40px"></span></div>
    <div class="body"><span class="kick">${esc(L.chapter)}</span><h1 class="h1">${qt(L.title)}</h1>
      <div class="rule">${Z.ruleLines(L).map(t => `<p>${mark(t)}</p>`).join('')}${id === 'L0' ? `<p class="u">${esc(D.unit)}</p>` : ''}</div>
      <div class="tbl"><h2><span>${timed ? 'زمن الحرف المضيء' : 'الحرف المضيء'}</span>${timed ? '<span>الخانة = حركة</span>' : ''}</h2>
        ${ex.map(x => `<div class="tr"><span class="w" lang="ar">${litWord(x)}</span>${timeOf(x)}${chip(x) || said(x) ? `<div class="sub">${chip(x)}${said(x)}</div>` : ''}</div>`).join('')}</div>
    </div>
    <div class="dock one"><a class="cta" href="#p/${id}">${I.mic}اسمع القارئ واقرأ بعده</a></div>`;
}

let T = null;
// a recording drawn on the scale `max` (seconds): its width is its own length, so a longer reading is a longer drawing
function track(pk, max, c, zones) {
  const len = pk ? pk.to - pk.from : 0, w = pk && max ? Math.max(12, Math.round(100 * len / max)) : 100;
  return `<div class="wv"><div style="width:${w}%">${Z.wave(pk, { n: Math.max(10, Math.round(50 * w / 100)), h: 34, bw: 3, gap: 2, c, zones })}</div></div>`;
}
function heard(x) {
  if (!T.rec) return '';
  const rd = T.reader(), rpk = rd ? T.readerPk() : null, mpk = T.rec.pk;
  const max = Math.max(rpk ? rpk.to - rpk.from : 0, mpk ? mpk.to - mpk.from : 0), find = Z.canLocate(x);
  return `<div class="ear">
      <div class="tk">${rd ? `<b>${x.recited ? 'المنشاوي' : 'القارئ'}</b>${track(rpk, max, '#8D8E95')}` : ''}<b>تلاوتك</b>${track(mpk, max, T.span ? '#C9CAD0' : '#2A3DE8', T.span ? [{ a: T.span[0], b: T.span[1], c: '#2A3DE8' }] : [])}</div>
      <p>${rd ? 'اسمع القارئ ثم صوتك: هل قرأتَ مثله؟' : 'اسمع صوتك، وقابله بالقاعدة: هل أصبتَ؟'}</p>
      <div class="acts">${rd ? `<button type="button" data-both>${I.both}اسمع الصوتين</button>` : ''}
        <button type="button" data-mine${rd ? '' : ' style="grid-column:1/-1"'}>${I.play('#0E0E10')}${T.span ? 'الكلمة من تلاوتك' : 'تلاوتك'}</button>
        <button type="button" class="y" data-ok>${I.ok('#fff')}أصبتُ</button></div>
      ${T.finding ? '<p class="small" role="status">يبحث الفاحص عن الكلمة في تلاوتك…</p>' : T.err ? `<p class="small">${esc(Z.errText(T.err))} فاسمع تلاوتك كاملة.</p>` : T.looked && !T.span ? '<p class="small">لم يجد الفاحص الكلمة في تلاوتك، فاسمعها كاملة.</p>' : ''}
      ${find ? '<p class="small">الفاحص هنا يجد موضع الكلمة في تلاوتك فقط، ولا يحكم عليها.</p>' : ''}</div>`;
}
function practice(id) {
  const L = LES[id]; if (!L) return location.hash = '';
  if (!T || T.L !== L) { T = Z.sitting(L, steps(L), () => { if (route === 'p') draw(); }, { ear: true }); T.n = 50; T.load(); }
  draw();
}
function draw() {
  const L = T.L, x = T.cur(), n = T.items.length;
  if (T.end) { const nx = IDS[IDS.indexOf(L.id) + 1];
    app.innerHTML = `<div class="end"><span class="ok">${I.ok('#0B8A5E', 40)}</span><h1>أتممتَ الدرس</h1><p>${qt(L.title)}</p>${nx ? `<a class="cta" href="#l/${nx}">الدرس التالي</a>` : ''}<a class="back" href="#">إلى الدروس</a></div>`;
    T = null; return; }
  // the closing test: the ayah bare until it is read, then its marks
  const bare = x.test && !T.rec, text = x.ay ? (bare ? Z.esc(x.ay.text) : Z.ayahLit(x)) : litWord(x), len = (x.ay ? x.ay.text : x.w).length;
  const rd = T.reader();
  app.innerHTML = `<div class="ab"><a class="ib" href="#l/${L.id}" aria-label="رجوع إلى الشرح">${I.back}</a><div class="tt"><b>الدرس ${no(L.id)}</b><span>${AR(T.i + 1)} من ${AR(n)}</span></div><span style="width:40px"></span>
      <div class="pr" aria-hidden="true"><i style="width:${Math.round(100 * (T.i + 1) / n)}%"></i></div></div>
    <div class="body">
      ${x.test ? `<div class="test">${bare ? 'الأخيرة: اقرأ الآية وليس عليها علامة، ثم تظهر الكلمة وحرفها.' : 'هذه الكلمة وحرفها: هل قرأتَها على القاعدة؟'}</div>` : ''}
      <p class="how">${x.ay ? Z.ayahLabel(x) : 'اقرأ'}${bare ? '' : chip(x)}</p>
      <p class="ay${len > 60 ? ' long' : ''}" lang="ar">${text}</p>
      ${bare || !(timeOf(x) || said(x)) ? '' : `<div class="place"><span class="q" lang="ar"><em>${esc(glyph(x))}</em></span>${timeOf(x)}${said(x)}</div>`}
      ${bare ? '<div class="nor">تسمع القارئ بعد أن تقرأ.</div>' : rd ? `<div class="pl"><button type="button" class="pb" data-play="${x.au}" aria-label="اسمع القارئ">${I.play('#fff', 15)}</button><span class="who">اسمع القارئ<small>${x.recited ? Z.TMP : 'القارئ'}</small></span></div>`
        : '<div class="nor">لم يُسجَّل صوت القارئ لهذا المثال بعد. اقرأه أنت، وقابله بالقاعدة.</div>'}
      ${T.on ? '<div class="recng" role="status"><i></i>يُسجَّل الآن. اقرأ ثم أوقف.</div>' : ''}
      ${T.msg ? `<div class="nor" role="alert">${esc(T.msg)}</div>` : ''}
      ${!Z.canRec ? '<div class="nor">هذا المتصفح لا يسجّل الصوت. افتح الصفحة في Safari أو Chrome.</div>' : ''}
      ${heard(x)}
    </div>
    <div class="dock"><button type="button" class="cta${T.on ? ' on' : ''}" data-mic>${T.on ? I.stop + 'أوقف' : I.mic + (T.rec ? 'اقرأ مرة أخرى' : 'اقرأ')}</button><button type="button" class="alt" data-next>${T.i + 1 < n ? 'التالية' : 'أنهِ الدرس'}</button></div>`;
}

let route = '';
function render() {
  const [a, b] = (location.hash || '#').slice(1).split('/');
  Z.stop(); route = a || 'list';
  if (a !== 'p' && T) { if (T.on) T.mic(); T = null; }
  if (a === 'l') lesson(b); else if (a === 'p') practice(b); else list();
  if (a !== 'p' || !T || !T.rec) window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const t = e.target, p = t.closest('[data-play]');
  if (p) return Z.play(D.audio[p.dataset.play]);
  if (!T) return;
  if (t.closest('[data-mic]')) return T.mic();
  if (t.closest('[data-mine]')) return T.span ? Z.play(T.rec.url, { from: Math.max(0, T.span[0] - .15), to: T.span[1] + .2 }) : Z.play(T.rec.url);
  if (t.closest('[data-both]')) return Z.playBoth(T.reader(), T.rec.url);
  if (t.closest('[data-ok]') || t.closest('[data-next]')) return T.next();
});
addEventListener('hashchange', render);
render();
window.__t = () => T;
})();
</script></body></html>
